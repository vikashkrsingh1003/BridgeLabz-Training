<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>All Greetings</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 50px;
        }

        .container {
            width: 700px;
            margin: auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
        }

        h1 {
            text-align: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 25px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: center;
        }

        th {
            background-color: #333;
            color: white;
        }

        input {
            padding: 8px;
            width: 180px;
        }

        button {
            padding: 8px 15px;
            border: none;
            color: white;
            cursor: pointer;
            border-radius: 4px;
        }

        .edit {
            background-color: #2196F3;
        }

        .delete {
            background-color: #f44336;
        }

        .back {
            margin-top: 25px;
            text-align: center;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>All Greetings</h1>

    <table>

        <thead>
        <tr>
            <th>Name</th>
            <th>Edit</th>
            <th>Delete</th>
        </tr>
        </thead>

        <tbody>

        <tr th:each="greeting : ${greetings}">

            <!-- NAME -->

            <td th:text="${greeting.name}">
                Vikash
            </td>


            <!-- EDIT -->

            <td>

                <form th:action="@{/edit}" method="post">

                    <input type="hidden"
                           name="id"
                           th:value="${greeting.id}">

                    <input type="text"
                           name="name"
                           th:value="${greeting.name}"
                           required>

                    <button type="submit"
                            class="edit">

                        Edit

                    </button>

                </form>

            </td>


            <!-- DELETE -->

            <td>

                <form th:action="@{/delete}"
                      method="get">

                    <input type="hidden"
                           name="id"
                           th:value="${greeting.id}">

                    <button type="submit"
                            class="delete"
                            onclick="return confirm('Are you sure you want to delete this greeting?');">

                        Delete

                    </button>

                </form>

            </td>

        </tr>

        </tbody>

    </table>


    <!-- BACK -->

    <div class="back">

        <a th:href="@{/greeting}">
            ← Back to Greeting App
        </a>

    </div>

</div>

</body>

</html>
